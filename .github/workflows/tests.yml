name: Software tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - name: Install the real backend for offline file-input verification
        if: matrix.python == '3.12'
        run: sudo apt-get update && sudo apt-get install -y aircrack-ng
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q hifi
      - run: hifi --version
